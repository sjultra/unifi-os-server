apiVersion: v1
kind: Service
metadata:
  name: {{ include "uos.name" . }}
  labels: {{- include "uos.labels" . | nindent 4 }}
  annotations:
    # the UI is HTTPS with a self-signed certificate
    traefik.ingress.kubernetes.io/service.serversscheme: https
    {{- if .Values.ui.ingress.insecureBackend }}
    traefik.ingress.kubernetes.io/service.serverstransport: {{ .Release.Namespace }}-{{ include "uos.name" . }}-insecure@kubernetescrd
    {{- end }}
spec:
  type: {{ .Values.ui.service.type }}
  selector: {{- include "uos.selector" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
      {{- if and (eq .Values.ui.service.type "NodePort") .Values.ui.service.nodePort }}
      nodePort: {{ .Values.ui.service.nodePort }}
      {{- end }}
