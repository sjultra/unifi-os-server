# UniFi OS Server release to run. Each version is downloaded from Ubiquiti on the node.
# Values come from https://fw-update.ui.com/api/firmware?filter=eq~~product~~unifi-os-server
# (sha256_checksum + _links.data.href per platform).
uos:
  version: "5.1.42"
  # Installer to use: "" = detect from the node at install time (x86_64 -> amd64, aarch64 -> arm64),
  # or force amd64 / arm64.
  arch: ""
  installers:
    amd64:
      url: https://fw-download.ubnt.com/data/unifi-os-server/5172-linux-x64-5.1.42-12e9e3cf-8f8b-4e54-928c-76b80a10c8a4.42-x64
      sha256: f6111e9396a42c74016f5dde9b01fbef486a6fe69efe137935e6e38b7c22f94d
    arm64:
      url: https://fw-download.ubnt.com/data/unifi-os-server/f730-linux-arm64-5.1.42-d2bca8bd-d6fc-4d20-99e5-b78235843c2f.42-arm64
      sha256: 8e29bd50cde8f781ace4b85599256ef62c02723bdc751044d4db90a087fb5207
  # Address devices are told to inform to (UniFi "system_ip"). Empty = the node's IP (status.hostIP).
  # A DNS name that resolves on the device LAN is more robust. Hostname or IPv4 characters only
  # (letters, digits, dots, hyphens); anything else fails rendering.
  systemIp: ""
  # Escape hatch: allow starting an older version on newer data (UniFi does not support downgrades).
  allowDowngrade: false

# The image is imported under this local-only name; it is never pulled from a registry.
localImage: localhost/unifi-os-server

# Images for the init steps (public, unmodified upstream images, from Google's Docker Hub mirror
# to avoid Docker Hub's anonymous pull limits). Use fully qualified refs: the import step pins them
# in containerd so a restart never depends on a registry pull.
tools:
  python: mirror.gcr.io/library/python:3.13.1-alpine3.21   # fetch + verify + extract
  ctr: mirror.gcr.io/rancher/k3s:v1.31.4-k3s1              # its ctr talks to the node's containerd
containerdSocket: /run/k3s/containerd/containerd.sock

# Scratch space for the 770-880 MB installer and the extracted image.tar (deleted after import)
downloadVolumeSizeLimit: 3Gi

# Required: pin to a single node with nodeSelector and/or affinity (one instance only; its data
# is node-bound). Rendering fails if both are empty.
nodeSelector: {}
#  kubernetes.io/hostname: my-node
affinity: {}
#  nodeAffinity:
#    requiredDuringSchedulingIgnoredDuringExecution:
#      nodeSelectorTerms:
#        - matchExpressions:
#            - { key: kubernetes.io/hostname, operator: In, values: [my-node] }
tolerations: []

persistence:
  storageClass: ""        # "" = cluster default (k3s: local-path)
  size: 20Gi

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits: {}

# Device-facing ports, published on the node with hostPort (same set and protocols as
# Ubiquiti's portmap.json in the 5.1.x installer). 80/443 are NOT published on the host:
# the UI goes through the Service/Ingress below.
hostPorts:
  enabled: true
  ports:
    - { name: inform, port: 8080, protocol: TCP }       # device inform (required for adoption)
    - { name: stun, port: 3478, protocol: UDP }         # STUN (required)
    - { name: discovery, port: 10003, protocol: UDP }   # device discovery
    - { name: syslog, port: 5514, protocol: UDP }       # remote syslog
    - { name: speedtest, port: 6789, protocol: TCP }    # mobile speed test
    - { name: hotspot-http, port: 8880, protocol: TCP } # guest portal redirect
    - { name: hotspot-8881, port: 8881, protocol: TCP }
    - { name: hotspot-8882, port: 8882, protocol: TCP }
    - { name: https-8444, port: 8444, protocol: TCP }
    - { name: amqps, port: 5671, protocol: TCP }
    - { name: port-28082, port: 28082, protocol: TCP }
    - { name: identity-hub, port: 9543, protocol: TCP }

ui:
  service:
    type: ClusterIP       # NodePort for LAN access
    nodePort: null
  ingress:
    enabled: false
    className: traefik
    host: ""
    # the UI serves HTTPS with a self-signed cert; Traefik must skip verification of it
    insecureBackend: true
